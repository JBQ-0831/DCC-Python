[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-bridge"
version = "1.1.0"
description = "DCC Python bridge: 独立的 CLI 工具，支持在 Maya、3ds Max、Substance Painter 等 DCC 中远程执行 Python 代码。VS Code 扩展为可选组件，用于人工调试场景。AI 可直接通过 CLI 发送代码，无需安装 VS Code 扩展。"
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.7"
authors = [
    { name = "Jbq" ,email="714229132@qq.com"},
]
keywords = ["dcc", "maya", "3dsmax", "substance-painter","substance-designer", "vscode", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dcc = "dcc_bridge.cli.main:main"

[project.urls]
Homepage = "https://github.com/JBQ-0831/dcc-python"
Repository = "https://github.com/JBQ-0831/dcc-python"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
