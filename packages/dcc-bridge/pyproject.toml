[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dcc-bridge"
version = "1.0.0"
description = "DCC Python bridge: TCP server, CLI, and VS Code extension core for executing Python in DCC tools like Maya and 3ds Max."
readme = "README.md"
license = { text = "PolyForm-Noncommercial-1.0.0" }
requires-python = ">=3.7"
authors = [
    { name = "Jbq" },
]
keywords = ["dcc", "maya", "3dsmax", "substance-painter", "vscode", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "click>=8.1.8",
]

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
dcc = "dcc_bridge.cli.main:main"

[project.urls]
Homepage = "https://github.com/yourusername/dcc-python"
Repository = "https://github.com/yourusername/dcc-python"

[tool.hatch.build.targets.wheel]
packages = ["src/dcc_bridge"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/README.md",
    "/LICENSE",
]

[dependency-groups]
dev = [
    "pytest>=7.4.4",
]
[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
