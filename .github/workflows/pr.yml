name: PR Review Gate

on:
  pull_request:

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  python:
    name: dcc-bridge (Python) gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/dcc-bridge
    steps:
      - uses: actions/checkout@v5

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Install dependencies (with dev extras)
        run: uv sync --extra dev

      - name: Run full test suite
        run: uv run python -m pytest tests/ -q

      - name: Run py2 compatibility gate
        run: uv run python -m pytest tests/test_py2_compat.py tests/test_setup_py2_gate.py -q

  extension:
    name: vscode-extension (TS) gate
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/vscode-extension
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: npm ci

      - name: Type check (tsc --noEmit)
        run: npm run check-types

      - name: Lint (eslint)
        run: npm run lint

      - name: Bundle (esbuild)
        run: node esbuild.js
