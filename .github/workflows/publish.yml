name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'
  VSIX_NAME: 'dcc-python-toolkit.vsix'

jobs:
  # 检测发布通道：纯数字版本 x.y.z → release，含字母（如 x.y.zb1）→ beta
  #
  # 通道策略（项目已稳定，不再拿 TestPyPI / Open VSX 当测试通道）：
  # - release：CLI → PyPI 正式；VS Code 插件 → VS Marketplace + Open VSX 双商店
  # - beta   ：CLI → PyPI 正式；VS Code 插件 → VS Marketplace + Open VSX 双商店
  #   （beta 仅体现在版本号标记上，仍走正式商店，便于灰度安装）

  detect:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect channel
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

  # 版本验证
  build:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 验证标签版本号与两包文件一致（归一化处理 npm 自动加横杠的问题）
      - name: Verify version consistency
        shell: bash
        run: |
          NPM_VER=$(jq -r .version packages/vscode-extension/package.json)
          UV_VER=$(grep -oP '^version = "\K[^"]+' packages/dcc-bridge/pyproject.toml)
          TAG_VER="${{ needs.detect.outputs.version }}"

          # 归一化：去掉数字与字母之间的横杠（1.2.0-b1 → 1.2.0b1）
          NORM_NPM=$(echo "$NPM_VER" | sed 's/\([0-9]\)-\([a-zA-Z]\)/\1\2/g')
          NORM_UV=$(echo "$UV_VER" | sed 's/\([0-9]\)-\([a-zA-Z]\)/\1\2/g')
          NORM_TAG=$(echo "$TAG_VER" | sed 's/\([0-9]\)-\([a-zA-Z]\)/\1\2/g')

          echo "Tag version:     $TAG_VER (normalized: $NORM_TAG)"
          echo "NPM version:     $NPM_VER (normalized: $NORM_NPM)"
          echo "UV version:      $UV_VER (normalized: $NORM_UV)"

          if [ "$NORM_NPM" != "$NORM_TAG" ] || [ "$NORM_UV" != "$NORM_TAG" ]; then
            echo "ERROR: Version mismatch between tag and package files!"
            exit 1
          fi
          echo "OK: All versions match ($TAG_VER)"

  # ======== CLI 发布到 PyPI（release 与 beta 均走 PyPI 正式）========
  publish-cli:
    needs: [detect, build]
    runs-on: ubuntu-latest
    environment: Release Environments
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python package
        run: uv build
        working-directory: packages/dcc-bridge

      - name: Publish CLI to PyPI
        run: uv publish
        working-directory: packages/dcc-bridge
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI }}

  # ======== VS Code 插件打包（一次构建，两个商店复用）========
  build-extension:
    needs: [detect, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        run: npm ci
        working-directory: packages/vscode-extension

      - name: Build VS Code extension
        run: npx @vscode/vsce package --no-dependencies -o ./dist/${{ env.VSIX_NAME }}
        working-directory: packages/vscode-extension

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: vsix-package
          path: packages/vscode-extension/dist/${{ env.VSIX_NAME }}
          if-no-files-found: error

  # ======== 发布到 VS Marketplace（正式商店）========
  publish-vscode-marketplace:
    needs: [detect, build, build-extension]
    runs-on: ubuntu-latest
    environment: Release Environments
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: ./dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish VS Code to VS Marketplace
        run: npx @vscode/vsce publish --packagePath ./dist/${{ env.VSIX_NAME }} --pat ${{ secrets.VSMARKETPLACE }}

  # ======== 发布到 Open VSX（正式商店）========
  publish-openvsx:
    needs: [detect, build, build-extension]
    runs-on: ubuntu-latest
    environment: Release Environments
    steps:
      - name: Download VSIX artifact
        uses: actions/download-artifact@v4
        with:
          name: vsix-package
          path: ./dist

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Publish VS Code to Open VSX
        run: npx ovsx publish ./dist/${{ env.VSIX_NAME }} --pat ${{ secrets.OPENVSX }}
