name: Publish

on:
  push:
    tags:
      - 'v*'

env:
  PYTHON_VERSION: '3.12'
  NODE_VERSION: '22'

jobs:
  # 检测发布通道：纯数字版本 x.y.z → release，含字母（如 x.y.zb1）→ beta
  
  detect:
    runs-on: ubuntu-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v5

      - name: Detect channel
        id: version
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "channel=release" >> "$GITHUB_OUTPUT"
          else
            echo "channel=beta" >> "$GITHUB_OUTPUT"
          fi

  # 版本验证
  build:
    needs: detect
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 验证标签版本号与两包文件一致（归一化处理 npm 自动加横杠的问题）
      - name: Verify version consistency
        shell: bash
        run: |
          NPM_VER=$(jq -r .version packages/vscode-extension/package.json)
          UV_VER=$(grep -oP '^version = "\K[^"]+' packages/dcc-bridge/pyproject.toml)
          TAG_VER="${{ needs.detect.outputs.version }}"

          # 归一化：去掉数字与字母之间的横杠（1.2.0-b1 → 1.2.0b1）
          NORM_NPM=$(echo "$NPM_VER" | sed 's/\([0-9]\)-\([a-zA-Z]\)/\1\2/g')
          NORM_UV=$(echo "$UV_VER" | sed 's/\([0-9]\)-\([a-zA-Z]\)/\1\2/g')
          NORM_TAG=$(echo "$TAG_VER" | sed 's/\([0-9]\)-\([a-zA-Z]\)/\1\2/g')

          echo "Tag version:     $TAG_VER (normalized: $NORM_TAG)"
          echo "NPM version:     $NPM_VER (normalized: $NORM_NPM)"
          echo "UV version:      $UV_VER (normalized: $NORM_UV)"

          if [ "$NORM_NPM" != "$NORM_TAG" ] || [ "$NORM_UV" != "$NORM_TAG" ]; then
            echo "ERROR: Version mismatch between tag and package files!"
            exit 1
          fi
          echo "OK: All versions match ($TAG_VER)"

  # ======== Release 发布（PyPI + VS Marketplace）========
  publish-release:
    needs: [detect, build]
    if: needs.detect.outputs.channel == 'release'
    runs-on: ubuntu-latest
    environment: Release Environments
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python package
        run: uv build
        working-directory: packages/dcc-bridge

      - name: Publish Python to PyPI
        run: uv publish
        working-directory: packages/dcc-bridge
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.PYPI }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        run: npm ci
        working-directory: packages/vscode-extension

      - name: Build VS Code extension
        run: npx @vscode/vsce package --no-dependencies -o ./dist/dcc-python.vsix
        working-directory: packages/vscode-extension

      - name: Publish VS Code to VS Marketplace
        run: npx @vscode/vsce publish --packagePath ./dist/dcc-python.vsix --pat ${{ secrets.VSMARKETPLACE }}
        working-directory: packages/vscode-extension

  # ======== Beta 发布（TestPyPI + Open VSX）========
  publish-beta:
    needs: [detect, build]
    if: needs.detect.outputs.channel == 'beta'
    runs-on: ubuntu-latest
    environment: Test Environments
    steps:
      - uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v6

      - name: Build Python package
        run: uv build
        working-directory: packages/dcc-bridge

      - name: Publish Python to TestPyPI
        run: uv publish --publish-url https://test.pypi.org/legacy/
        working-directory: packages/dcc-bridge
        env:
          UV_PUBLISH_TOKEN: ${{ secrets.TESTPYPI }}

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install npm dependencies
        run: npm ci
        working-directory: packages/vscode-extension

      - name: Build VS Code extension
        run: npx @vscode/vsce package --no-dependencies -o ./dist/dcc-python.vsix
        working-directory: packages/vscode-extension

      - name: Publish VS Code to Open VSX
        run: npx ovsx publish ./dist/dcc-python.vsix --pat ${{ secrets.OPENVSX }}
        working-directory: packages/vscode-extension